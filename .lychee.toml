# Lychee link-checker configuration
# Docs: https://lychee.cli.rs/usage/configuration/

# Accept these HTTP status codes
accept = [
  "100..=103",
  "200..=299",
  "301", "302", "307", "308",
  # 403 = bot-blocked (common on VN government/financial sites)
  "403",
  # 406 = Not Acceptable (anti-bot measure, site is live)
  "406",
  # 410 = some VN sites return this to crawlers but serve browsers normally
  "410",
  # 429 = rate-limited — not a broken link
  "429",
]

# Allow self-signed/untrusted SSL certs (Vietnamese gov sites: HNX, GSO, SSC)
insecure = true

# Exclude URL patterns (regex)
exclude = [
  # Badge URLs
  "https://awesome\\.re",
  "https://licensebuttons\\.net",
  # Local anchors
  "^#",
  # Contributor placeholder links
  "CONTRIBUTING\\.md$",
  # Yahoo Finance — aggressively blocks CI runners (HTTP/2 errors, redirects)
  "finance\\.yahoo\\.com",
  # VnExpress — returns 406 to all non-browser clients
  "e\\.vnexpress\\.net",
  # NDH.vn — unreachable from GitHub Actions runners (region-blocked)
  "ndh\\.vn",
  # DataCore docs — may not be public yet
  "docs\\.datacore\\.vn",
]

# Request timeout in seconds (VN gov sites are slow)
timeout = 30

# Max retries per link
max_retries = 3

# Parallel requests
threads = 4

# User-agent to reduce bot-blocking
user_agent = "Mozilla/5.0 (compatible; lychee/link-checker; +https://github.com/DataCore-VietNam/awesome-vietnam-finance-data)"

# Avoids rate-limiting for github.com URLs
github_token = "${GITHUB_TOKEN}"
