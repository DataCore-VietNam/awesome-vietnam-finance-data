name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security,dependencies
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 14 days unless there is new activity.
          stale-pr-message: |
            This PR has been inactive for 30 days. It will be closed in 14 days unless updated.
          close-issue-message: Closing due to inactivity. Reopen if still relevant.
          close-pr-message: Closing due to inactivity. Reopen if still relevant.
          operations-per-run: 100
