name: Links

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".lycheeignore"
      - ".lychee.toml"
  pull_request:
    paths:
      - "README.md"
  schedule:
    # Every Monday 03:00 UTC = 10:00 ICT
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected"
          content-filepath: ./lychee/out.md
          labels: |
            broken-link
            automated
