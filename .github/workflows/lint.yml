name: Lint

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "README.md"
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "README.md"
          config: ".markdownlint.json"
